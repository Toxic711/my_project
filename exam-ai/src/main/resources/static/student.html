<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的考试 · 智能在线考试系统</title>
<link rel="stylesheet" href="/app.css">
<style>
  .layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}
  .q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .q-stem{font-size:15.5px;line-height:1.7;margin:6px 0 14px}
  .q-meta{font-size:12.5px;color:var(--muted)}
  .result-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #1f2a3d}
  .result-row:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="topbar">
  <div class="left">
    <div class="brand" style="margin:0"><div class="logo">考</div><div class="name" style="font-size:15px">智能在线考试系统</div></div>
    <span class="pill" id="roleTag">学生</span>
  </div>
  <div class="right">
    <span id="who"></span>
    <button class="ghost" onclick="Auth.logout()">退出登录</button>
  </div>
</div>

<div class="wrap">
  <!-- 视图 1：考试列表 -->
  <section id="view-list">
    <h2 style="font-size:16px;margin-bottom:4px">可参加的考试</h2>
    <div class="sub" style="margin-bottom:14px">只展示已发布（PUBLISHED）的考试；提交过的考试可查看成绩。</div>
    <div id="examList"><div class="empty">加载中…</div></div>
  </section>

  <!-- 视图 2：答题 -->
  <section id="view-exam" style="display:none">
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <h2 id="examTitle" style="font-size:16px"></h2>
          <div class="sub" id="examSub"></div>
        </div>
        <div style="text-align:right">
          <div class="sub">剩余时间</div>
          <div class="timer" id="timer">--:--</div>
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="q-head">
          <div class="q-meta" id="qMeta"></div>
          <div class="q-meta" id="qType"></div>
        </div>
        <div class="q-stem" id="qStem"></div>
        <div id="qOptions"></div>
        <div style="display:flex;justify-content:space-between;margin-top:18px">
          <button class="ghost" id="btnPrev">← 上一题</button>
          <div style="display:flex;gap:8px">
            <button class="ghost" id="btnNext">下一题 →</button>
            <button class="primary" id="btnSubmit">交卷</button>
          </div>
        </div>
      </div>

      <aside>
        <div class="card" style="margin-bottom:14px">
          <div class="sub" style="margin-bottom:8px">答题卡</div>
          <div class="q-nav" id="qNav"></div>
        </div>

        <div class="card">
          <div class="sub" style="margin-bottom:8px">摄像头监考</div>
          <video id="cam" autoplay playsinline muted
                 style="width:100%;border-radius:9px;background:#000;transform:scaleX(-1);aspect-ratio:4/3;object-fit:cover"></video>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="primary" id="btnCam" style="flex:1">开启摄像头</button>
            <button class="ghost" id="btnCamStop">停止</button>
          </div>
          <div class="sub" id="camState" style="margin-top:8px">未开启 · 点击上面按钮授权摄像头</div>

          <table style="margin-top:8px">
            <tr><td class="sub">状态</td><td id="mState">—</td></tr>
            <tr><td class="sub">人脸占比</td><td id="mArea">—</td></tr>
            <tr><td class="sub">头姿 yaw / pitch</td><td id="mPose">—</td></tr>
            <tr><td class="sub">亮度 / 运动</td><td id="mEnv">—</td></tr>
            <tr><td class="sub">上报</td><td id="mReport">—</td></tr>
          </table>

          <div class="logbox" id="proctorLog" style="margin-top:8px;max-height:120px">—</div>

          <details style="margin-top:8px">
            <summary class="sub" style="cursor:pointer">没有摄像头？用按钮模拟事件</summary>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
              <button data-k="normal">正常帧</button>
              <button data-k="tilt">偏转/视线离开</button>
              <button data-k="missing">人脸丢失</button>
              <button data-k="multi">多人脸</button>
            </div>
          </details>
        </div>
      </aside>
    </div>
  </section>

  <!-- 视图 3：成绩 -->
  <section id="view-result" style="display:none">
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <h2 id="resTitle" style="font-size:16px">成绩</h2>
          <div class="sub" id="resSub"></div>
        </div>
        <div style="text-align:right">
          <div class="sub">得分</div>
          <div style="font-size:26px;font-weight:700" id="resScore">--</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="sub" style="margin-bottom:6px">逐题解析</div>
      <div id="resItems"></div>
      <div style="margin-top:16px"><button class="primary" onclick="backToList()">返回到考试列表</button></div>
    </div>
  </section>
</div>

<script src="/common.js"></script>
<script>
const me = Auth.require(['STUDENT']);
if (me) {
  document.getElementById('who').textContent = me.realName || me.username;
  document.getElementById('roleTag').textContent = '学生';
}

const PROFILES = {
  normal:  { faceDetected: true,  faceCount: 1, yaw: 3,  pitch: 2,  roll: 1,  gazeOffScreen: false, ear: 0.28 },
  tilt:    { faceDetected: true,  faceCount: 1, yaw: 46, pitch: 35, roll: 30, gazeOffScreen: true,  ear: 0.14 },
  missing: { faceDetected: false, faceCount: 0, yaw: 0,  pitch: 0,  roll: 0,  gazeOffScreen: false, ear: 0.0  },
  multi:   { faceDetected: true,  faceCount: 2, yaw: 0,  pitch: 0,  roll: 0,  gazeOffScreen: false, ear: 0.30 }
};

let state = null;            // { exam, recordId, questions, answers, index, deadline, timerId }
const DRAFT_KEY = id => 'ea_draft_' + id;
const RECORD_KEY = id => 'ea_record_' + id;

function switchView(name) {
  ['list', 'exam', 'result'].forEach(n => {
    document.getElementById('view-' + n).style.display = (n === name ? '' : 'none');
  });
}

/* ---------------- 考试列表 ---------------- */
async function loadExams() {
  switchView('list');
  const box = document.getElementById('examList');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const exams = await api('GET', '/api/exams');
    if (!exams.length) { box.innerHTML = '<div class="empty">暂无已发布的考试</div>'; return; }
    box.innerHTML = exams.map(ex => {
      const rec = localStorage.getItem(RECORD_KEY(ex.id));
      const action = rec
        ? `<button class="ghost" onclick="viewResult(${rec})">查看成绩</button>
           <button class="primary" onclick="startExam(${ex.id})">重新作答</button>`
        : `<button class="primary" onclick="startExam(${ex.id})">开始考试</button>`;
      return `<div class="exam-item">
        <div>
          <h3>${esc(ex.title)}</h3>
          <div class="sub">${esc(ex.description || '')}</div>
          <div class="sub" style="margin-top:6px">
            <span class="pill">${ex.questionCount} 题</span>
            <span class="pill">${ex.durationMinutes} 分钟</span>
            <span class="pill">总分 ${ex.totalScore}</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex:none">${action}</div>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty bad">加载失败：${esc(e.message)}</div>`;
  }
}

/* ---------------- 开始考试 ---------------- */
async function startExam(examId) {
  try {
    const r = await api('POST', `/api/exams/${examId}/start`);
    const draft = JSON.parse(localStorage.getItem(DRAFT_KEY(r.recordId)) || '{}');
    state = {
      exam: r,
      recordId: r.recordId,
      questions: r.questions,
      answers: draft.answers || {},
      index: 0,
      deadline: Date.now() + r.durationMinutes * 60 * 1000,
      timerId: null
    };
    localStorage.setItem(RECORD_KEY(examId), String(r.recordId));
    document.getElementById('examTitle').textContent = r.title;
    document.getElementById('examSub').textContent =
      `${r.questionCount} 题 · 总分 ${r.totalScore}${r.resumed ? ' · 继续上次作答' : ''}`;
    switchView('exam');
    renderNav(); renderQuestion();
    startTimer();
    toast(r.resumed ? '已恢复上次作答' : '开始考试，注意剩余时间', 'ok');
  } catch (e) {
    toast('无法开始：' + e.message, 'bad');
    if (e.status === 409) loadExams();
  }
}

function startTimer() {
  clearInterval(state.timerId);
  const tick = () => {
    const left = Math.max(0, Math.round((state.deadline - Date.now()) / 1000));
    const el = document.getElementById('timer');
    el.textContent = fmtDuration(left);
    el.className = 'timer' + (left <= 60 ? ' bad' : left <= 300 ? ' warn' : '');
    if (left === 0) { clearInterval(state.timerId); toast('时间到，自动交卷', 'warn'); submitExam(true); }
  };
  tick();
  state.timerId = setInterval(tick, 1000);
}

/* ---------------- 渲染题目 ---------------- */
function currentQuestion() { return state.questions[state.index]; }

function renderNav() {
  document.getElementById('qNav').innerHTML = state.questions.map((q, i) => {
    const done = state.answers[q.id] ? 'done' : '';
    const cur = i === state.index ? 'cur' : '';
    return `<button class="${done} ${cur}" onclick="gotoQ(${i})">${i + 1}</button>`;
  }).join('');
}

function renderQuestion() {
  const q = currentQuestion();
  const total = state.questions.length;
  document.getElementById('qMeta').textContent = `第 ${state.index + 1} / ${total} 题 · ${q.score} 分`;
  const typeText = { SINGLE: '单选题', MULTIPLE: '多选题', JUDGE: '判断题' }[q.type] || q.type;
  document.getElementById('qType').textContent = typeText + (q.knowledgePoint ? ' · ' + q.knowledgePoint : '');
  document.getElementById('qStem').textContent = q.stem;

  const picked = (state.answers[q.id] || '').split('');
  document.getElementById('qOptions').innerHTML = (q.options || []).map(o => {
    const sel = picked.includes(o.key) ? 'sel' : '';
    return `<div class="option ${sel}" onclick="pick('${o.key}')">
      <div class="k">${esc(o.key)}</div><div>${esc(o.content)}</div>
    </div>`;
  }).join('');

  document.getElementById('btnPrev').disabled = state.index === 0;
  document.getElementById('btnNext').disabled = state.index === total - 1;
  renderNav();
}

function pick(key) {
  const q = currentQuestion();
  const multi = q.type === 'MULTIPLE';
  let cur = state.answers[q.id] || '';
  if (multi) {
    const s = new Set(cur.split('').filter(Boolean));
    s.has(key) ? s.delete(key) : s.add(key);
    cur = [...s].sort().join('');
  } else {
    cur = (cur === key ? '' : key);
  }
  state.answers[q.id] = cur;
  localStorage.setItem(DRAFT_KEY(state.recordId), JSON.stringify({ answers: state.answers }));
  renderQuestion();
}

function gotoQ(i) { state.index = i; renderQuestion(); }
document.getElementById('btnPrev').onclick = () => { if (state.index > 0) gotoQ(state.index - 1); };
document.getElementById('btnNext').onclick = () => { if (state.index < state.questions.length - 1) gotoQ(state.index + 1); };
document.getElementById('btnSubmit').onclick = () => {
  const unanswered = state.questions.filter(q => !state.answers[q.id]).length;
  const msg = unanswered ? `还有 ${unanswered} 题未作答，确定交卷吗？` : '确定交卷吗？';
  if (confirm(msg)) submitExam(false);
};

/* ---------------- 交卷 ---------------- */
async function submitExam(auto) {
  clearInterval(state.timerId);
  if (Cam.timer || Cam.stream) stopCam();   // 交卷即停止摄像头采集
  try {
    const answers = state.questions.map(q => ({ questionId: q.id, answer: state.answers[q.id] || '' }));
    const r = await api('POST', `/api/exams/records/${state.recordId}/submit`,
      { requestId: 'web-' + Date.now(), answers });
    localStorage.removeItem(DRAFT_KEY(state.recordId));
    if (r.examId) localStorage.setItem(RECORD_KEY(r.examId), String(state.recordId));
    toast(`交卷成功：${r.score} / ${r.totalScore} 分` + (auto ? '（自动交卷）' : ''), 'ok');
    await showResult(state.recordId);
  } catch (e) {
    toast('交卷失败：' + e.message, 'bad');
  }
}

/* ---------------- 成绩 ---------------- */
async function showResult(recordId) {
  switchView('result');
  try {
    const r = await api('GET', `/api/exams/records/${recordId}/result`);
    document.getElementById('resTitle').textContent = r.title;
    document.getElementById('resSub').textContent =
      `状态 ${r.status} · 正确 ${r.items.filter(i => i.correct).length} / ${r.items.length}`;
    document.getElementById('resScore').textContent = `${r.score} / ${r.totalScore}`;
    document.getElementById('resItems').innerHTML = r.items.map((it, i) => `
      <div class="result-row">
        <div class="q-meta">${i + 1}</div>
        <div>
          <div style="margin-bottom:4px">${esc(it.stem)}</div>
          <div class="sub">你的答案：<b class="${it.correct ? 'ok' : 'bad'}">${esc(it.answerValue || '未作答')}</b>
            · 正确答案：<b>${esc(it.correctOption)}</b> · 得分 ${it.score}/${it.maxScore}</div>
          <div class="sub" style="margin-top:4px">解析：${esc(it.analysis || '—')}</div>
        </div>
        <div class="${it.correct ? 'ok' : 'bad'}">${it.correct ? '✓' : '✗'}</div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('resItems').innerHTML = `<div class="empty bad">${esc(e.message)}</div>`;
  }
}

function viewResult(recordId) { showResult(Number(recordId)); }
function backToList() { state = null; loadExams(); }

/* ================= 摄像头监考：真实视频 + 本地轻量检测 =================
   说明：本机离线拿不到 MediaPipe 模型资源，所以这里用「肤色 + 运动」的轻量检测
   产出**同构的特征**（faceDetected / faceCount / yaw / pitch / gazeOffScreen / ear），
   上报链路与生产完全一致（POST /api/proctor/events），把算法换成 MediaPipe
   FaceLandmarker 只需要替换 analyzeFrame()，其余不动。
*/
const Cam = {
  stream: null, timer: null, canvas: null, ctx: null, shotCanvas: null,
  W: 96, H: 72, prev: null, motion: 0,
  lastReportAt: 0, lastState: '', lastLevel: 'NONE', reports: 0, shots: 0
};

function camState(text, cls) {
  const el = document.getElementById('camState');
  el.textContent = text;
  el.className = 'sub ' + (cls || '');
}

function camLog(text) {
  const box = document.getElementById('proctorLog');
  if (box.dataset.init !== '1') { box.textContent = ''; box.dataset.init = '1'; }
  box.textContent = `[${fmtTime(Date.now())}] ${text}\n` + box.textContent;
  const lines = box.textContent.split('\n');
  if (lines.length > 40) box.textContent = lines.slice(0, 40).join('\n');
}

/* ---------- 1. 打开/关闭摄像头 ---------- */
async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camState('当前浏览器不支持摄像头 API，可用下方模拟按钮', 'bad');
    return;
  }
  try {
    Cam.stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false
    });
    const video = document.getElementById('cam');
    video.srcObject = Cam.stream;
    await video.play();

    Cam.canvas = document.createElement('canvas');
    Cam.canvas.width = Cam.W; Cam.canvas.height = Cam.H;
    Cam.ctx = Cam.canvas.getContext('2d', { willReadFrequently: true });
    Cam.shotCanvas = document.createElement('canvas');
    Cam.shotCanvas.width = 320; Cam.shotCanvas.height = 240;

    camState('监控中：每 400ms 采一帧做本地检测，状态变化或每 2s 上报一次', 'ok');
    document.getElementById('btnCam').textContent = '重新开启';
    clearInterval(Cam.timer);
    Cam.timer = setInterval(camTick, 400);
    camLog('摄像头已开启');
  } catch (e) {
    camState('摄像头不可用：' + e.message + '（可改用下方模拟按钮）', 'bad');
  }
}

function stopCam() {
  clearInterval(Cam.timer); Cam.timer = null;
  if (Cam.stream) { Cam.stream.getTracks().forEach(t => t.stop()); Cam.stream = null; }
  document.getElementById('cam').srcObject = null;
  camState('已停止');
  camLog('摄像头已停止');
}

document.getElementById('btnCam').onclick = startCam;
document.getElementById('btnCamStop').onclick = stopCam;

/* ---------- 2. 单帧检测：肤色连通域 + 运动能量 ---------- */
function analyzeFrame(data, w, h) {
  const n = w * h;
  const mask = new Uint8Array(n);
  let sum = 0;
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = data[p], g = data[p + 1], b = data[p + 2];
    sum += (r * 299 + g * 587 + b * 114) / 1000;
    // 经典 RGB 肤色判定（对东亚肤色同样有效）
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    if (r > 95 && g > 40 && b > 20 && max - min > 15 && Math.abs(r - g) > 15 && r > g && r > b) {
      mask[i] = 1;
    }
  }
  const brightness = sum / n;

  // 运动能量：与上一帧的灰度差
  let diff = 0;
  if (Cam.prev) {
    for (let i = 0; i < n; i++) diff += Math.abs(Cam.prev[i] - (mask[i] ? 1 : 0));
    Cam.motion = Math.min(1, (diff / n) * 6);
  }

  // 连通域（4 邻域，BFS）：找出最大的两块肤色区域
  const seen = new Uint8Array(n);
  const blobs = [];
  const stack = [];
  for (let idx = 0; idx < n; idx++) {
    if (!mask[idx] || seen[idx]) continue;
    stack.length = 0; stack.push(idx); seen[idx] = 1;
    let count = 0, sx = 0, sy = 0, minX = w, maxX = 0, minY = h, maxY = 0;
    while (stack.length) {
      const cur = stack.pop();
      const x = cur % w, y = (cur / w) | 0;
      count++; sx += x; sy += y;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      const nb = [cur - 1, cur + 1, cur - w, cur + w];
      for (const q of nb) {
        if (q < 0 || q >= n) continue;
        if (Math.abs((q % w) - x) > 1) continue;    // 防跨行
        if (mask[q] && !seen[q]) { seen[q] = 1; stack.push(q); }
      }
    }
    if (count >= n * 0.01) blobs.push({ count, cx: sx / count, cy: sy / count, minX, maxX, minY, maxY });
  }
  blobs.sort((a, b) => b.count - a.count);

  // 存灰度掩码给下一帧算运动
  Cam.prev = mask;

  const main = blobs[0];
  const areaRatio = main ? main.count / n : 0;
  const second = blobs[1];
  const multi = !!(main && second && second.count >= main.count * 0.45
    && Math.abs(second.cx - main.cx) > w * 0.16);

  const detected = areaRatio >= 0.02 && brightness >= 22;
  const yaw = main ? Math.max(-60, Math.min(60, (main.cx / w - 0.5) * 90)) : 0;
  const pitch = main ? Math.max(-45, Math.min(45, (main.cy / h - 0.46) * 70)) : 0;
  const gazeOffScreen = detected && (Math.abs(yaw) > 25 || Math.abs(pitch) > 25);
  // ear 用「脸部上半区暗像素比例」近似：眨眼/闭眼时暗区比例升高
  let ear = 0.30;
  if (main) {
    let dark = 0, total = 0;
    const topY = main.minY, botY = main.minY + Math.max(2, (main.maxY - main.minY) * 0.4);
    for (let y = topY; y < botY; y++) {
      for (let x = main.minX; x <= main.maxX; x++) {
        const p = (y * w + x) * 4;
        if (p < 0 || p + 2 >= data.length) continue;
        const luma = (data[p] * 299 + data[p + 1] * 587 + data[p + 2] * 114) / 1000;
        total++; if (luma < 70) dark++;
      }
    }
    if (total > 0) ear = Math.max(0.05, Math.min(0.45, 0.1 + (1 - dark / total) * 0.32));
  }

  let state = '正常';
  if (brightness < 22) state = '画面过暗（疑似遮挡）';
  else if (!detected) state = '未检测到人脸';
  else if (multi) state = '检测到多人';
  else if (gazeOffScreen) state = '视线/头部偏离';

  return {
    brightness, areaRatio, detected, faceCount: multi ? 2 : (detected ? 1 : 0),
    yaw, pitch, gazeOffScreen, ear, motion: Cam.motion, state
  };
}

/* ---------- 3. 每帧更新 UI，按需上报 ---------- */
function camTick() {
  const video = document.getElementById('cam');
  if (!video.videoWidth || !Cam.ctx) return;
  Cam.ctx.drawImage(video, 0, 0, Cam.W, Cam.H);
  const img = Cam.ctx.getImageData(0, 0, Cam.W, Cam.H);
  const m = analyzeFrame(img.data, Cam.W, Cam.H);

  document.getElementById('mState').textContent = m.state;
  document.getElementById('mState').className = m.state === '正常' ? 'ok' : 'warn';
  document.getElementById('mArea').textContent = (m.areaRatio * 100).toFixed(1) + '%';
  document.getElementById('mPose').textContent = `${m.yaw.toFixed(0)}° / ${m.pitch.toFixed(0)}°`;
  document.getElementById('mEnv').textContent =
    `${m.brightness.toFixed(0)} / ${(m.motion * 100).toFixed(0)}%`;

  const now = Date.now();
  const changed = m.state !== Cam.lastState;
  if (!changed && now - Cam.lastReportAt < 2000) return;
  Cam.lastState = m.state;
  Cam.lastReportAt = now;
  reportFrame(m, changed);
}

/* ---------- 4. 上报（带缩略图，后端存证）---------- */
async function reportFrame(m, immediate) {
  if (!state) return;
  Cam.reports++;
  Cam.shots++;
  const withShot = Cam.shots % 5 === 0 || m.state !== '正常';
  const body = {
    examRecordId: state.recordId,
    sessionId: 'cam-web',
    faceDetected: m.detected,
    faceCount: m.faceCount,
    yaw: m.yaw, pitch: m.pitch, roll: 0,
    gazeOffScreen: m.gazeOffScreen,
    ear: m.ear,
    timestamp: Date.now()
  };
  if (withShot) body.thumbnailBase64 = snapShot();

  try {
    const r = await api('POST', '/api/proctor/events', body);
    document.getElementById('mReport').textContent =
      `第 ${Cam.reports} 次 · 上次风险分 ${r.riskScore}（${r.riskLevel || 'NONE'}）`;
    const bad = r.riskLevel === 'L2' || r.riskLevel === 'L3';
    if (bad || immediate) {
      camLog(`${m.state} → risk=${r.riskScore} ${r.riskLevel}${r.alertTriggered ? ' ⚠ 已告警' : ''}`);
    }
    if (r.alertTriggered) {
      toast(`已触发 ${r.riskLevel} 告警：${r.reason || m.state}`, 'bad');
    }
    Cam.lastLevel = r.riskLevel || 'NONE';
  } catch (e) {
    camLog('上报失败：' + e.message);
  }
}

function snapShot() {
  const video = document.getElementById('cam');
  const c = Cam.shotCanvas, ctx = c.getContext('2d');
  ctx.drawImage(video, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.6);
}

/* 切走标签页 → 立刻上报一次“人脸丢失”（真实监考里这是重要信号） */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && Cam.timer && state) {
    reportFrame({ detected: false, faceCount: 0, yaw: 0, pitch: 0, gazeOffScreen: false, ear: 0, state: '切出标签页' }, true);
  }
});

/* ---------------- 模拟事件（无摄像头时用） ---------------- */
document.querySelectorAll('[data-k]').forEach(b => {
  b.onclick = async () => {
    if (!state) { toast('先开始考试', 'warn'); return; }
    const body = Object.assign({
      examRecordId: state.recordId, sessionId: 'web-demo', timestamp: Date.now()
    }, PROFILES[b.dataset.k]);
    try {
      const r = await api('POST', '/api/proctor/events', body);
      const cls = r.riskLevel === 'L3' ? 'bad' : r.riskLevel === 'L2' ? 'warn' : 'ok';
      toast(`风险分 ${r.riskScore}（${r.riskLevel || 'NONE'}）` + (r.alertTriggered ? ' · 已推送告警' : ''), cls);
      camLog(`${b.textContent} → risk=${r.riskScore} ${r.riskLevel}${r.alertTriggered ? ' ⚠ 告警' : ''}`);
    } catch (e) { toast('上报失败：' + e.message, 'bad'); }
  };
});

loadExams();
</script>
