spring:
  datasource:
    # PostgreSQL 连接：账号密码用环境变量注入，不要提交到仓库
    url: "jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:devflow}?stringtype=unspecified"
    driver-class-name: org.postgresql.Driver
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      # 与 demo 共用同一份 DDL/DML（BIGSERIAL / SMALLINT / TEXT 均兼容真实 PG）
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
