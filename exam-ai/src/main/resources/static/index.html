<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能在线考试系统 · 登录</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="center">
  <div class="card" style="width:420px">
    <div class="brand">
      <div class="logo">考</div>
      <div>
        <div class="name">智能在线考试系统</div>
        <div class="sub">AI 防作弊 · 自动出题 · 实时监考</div>
      </div>
    </div>

    <div style="margin-top:18px">
      <label>账号</label>
      <input id="username" placeholder="teacher1 / student1 / admin" autocomplete="username">
      <label>密码</label>
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="primary" style="width:100%;margin-top:16px" id="btnLogin">登录</button>
    </div>

    <div class="role-tabs">
      <button data-u="student1" data-p="student123">学生 student1</button>
      <button data-u="teacher1" data-p="teacher123">教师 teacher1</button>
      <button data-u="admin" data-p="admin123">管理员</button>
    </div>
    <div class="sub" style="margin-top:10px">
      演示账号密码均为「账号名 + 123」；点击上面按钮可自动填充。
    </div>

    <div id="err" class="bad" style="margin-top:10px;font-size:13px"></div>
  </div>
</div>

<script src="/common.js"></script>
<script>
  // 已登录则直接进对应首页
  if (Auth.token && Auth.user) location.replace(Auth.home(Auth.user.role));

  document.querySelectorAll('.role-tabs button').forEach(b => {
    b.onclick = () => {
      document.getElementById('username').value = b.dataset.u;
      document.getElementById('password').value = b.dataset.p;
    };
  });

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('err');
    err.textContent = '';
    if (!username || !password) { err.textContent = '请输入账号和密码'; return; }
    const btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const r = await api('POST', '/api/auth/login', { username, password });
      Auth.save(r.token, r.user);
      location.replace(Auth.home(r.user.role));
    } catch (e) {
      err.textContent = '登录失败：' + e.message;
    } finally {
      btn.disabled = false; btn.textContent = '登录';
    }
  }

  document.getElementById('btnLogin').onclick = login;
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
